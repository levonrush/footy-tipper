name: Smoke Checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q pipeline footy-tipper-train.py footy-tipper-predict.py

      - name: Run smoke tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
