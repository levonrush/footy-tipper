name: Smoke Checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Compile Python sources
        run: python -m compileall -q pipeline

      - name: Lint (error-class rules only)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 pipeline tests

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run smoke tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  r-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Parse R sources
        run: |
          Rscript -e 'files <- list.files("pipeline", pattern = "[.]R$", recursive = TRUE, full.names = TRUE); for (f in files) { message("parsing ", f); parse(f) }'

      - name: Install R integrity-test dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr", "tibble", "tidyr", "stringr", "DBI", "RSQLite"), repos = "https://cloud.r-project.org")'

      - name: Run R data integrity regressions
        run: Rscript tests/r/test_data_prep_integrity.R

  watchdog:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: watchdog

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: watchdog/package-lock.json

      - name: Install watchdog tooling
        run: npm ci --ignore-scripts

      - name: Check watchdog source
        run: npm run check

      - name: Test watchdog
        run: npm test

      - name: Audit watchdog tooling
        run: npm audit --audit-level=high
