name: Predict
run-name: ${{ inputs.watchdog && 'Predict watchdog gate' || (github.event_name == 'workflow_dispatch' && format('Predict manual ({0})', inputs.mode) || 'Predict scheduled gate') }}

# Targeted Sydney-time gate: reads schedule.json from Drive and runs the full
# predict job at the first available poll after 11am on the first-game day of
# the next unsent round. A separately hosted watchdog may request the same gate
# through an actor-guarded input. Manual dispatch bypasses the gate and keeps
# the exact mode/round confirmation contract.

on:
  schedule:
    - cron: "7,22,37,52 11 * * *"
      timezone: "Australia/Sydney"
    - cron: "7,37 12-14 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      mode:
        description: "TEST (default) = test address only; REFRESH = update without email; LIVE = production list"
        type: choice
        default: test
        options: [test, refresh, live]
      confirmed_round:
        description: "Manual LIVE only: the round number you explicitly confirmed"
        required: false
        type: string
      watchdog:
        description: "Internal only: request the schedule gate as the configured watchdog source"
        required: false
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gate dependencies
        run: pip install --quiet google-api-python-client google-auth

      - name: Materialise secrets
        env:
          SECRETS_ENV: ${{ secrets.SECRETS_ENV }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s\n' "$SECRETS_ENV" > secrets.env
          printf '%s\n' "$SERVICE_ACCOUNT_JSON" > service-account-token.json
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            case "$line" in *=*) ;; *) continue ;; esac
            value="${line#*=}"
            value="${value%\"}"; value="${value#\"}"
            [ -n "$value" ] && echo "::add-mask::$value"
          done < secrets.env

      - name: Gate decision
        id: decide
        env:
          ACTOR: ${{ github.actor }}
          CONFIRMED_ROUND: ${{ inputs.confirmed_round }}
          DISPATCH_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          WATCHDOG_ACTOR: ${{ vars.FOOTY_TIPPER_WATCHDOG_ACTOR }}
          WATCHDOG_REQUEST: ${{ inputs.watchdog }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WATCHDOG_REQUEST" = "true" ]; then
            if [ -z "$WATCHDOG_ACTOR" ] || [ "$ACTOR" != "$WATCHDOG_ACTOR" ]; then
              echo "Watchdog dispatch refused: actor is not the configured watchdog source." >&2
              exit 2
            fi
            if [ -n "$CONFIRMED_ROUND" ]; then
              echo "Watchdog dispatch must not provide confirmed_round." >&2
              exit 2
            fi
            python -m pipeline.ops.actions_runner gate
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$ACTOR" in
              *"[bot]")
                echo "Bot actors may only use the guarded watchdog gate." >&2
                exit 2
                ;;
            esac
            if [ "$DISPATCH_MODE" = "live" ]; then
              case "$CONFIRMED_ROUND" in
                ''|*[!0-9]*)
                  echo "Manual LIVE requires a numeric confirmed_round." >&2
                  exit 2
                  ;;
              esac
            elif [ -n "$CONFIRMED_ROUND" ]; then
              echo "confirmed_round is valid only for LIVE." >&2
              exit 2
            fi
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
          else
            python -m pipeline.ops.actions_runner gate
          fi

  predict:
    needs: gate
    if: needs.gate.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    concurrency:
      group: footy-tipper-state
      cancel-in-progress: false
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Materialise secrets
        env:
          SECRETS_ENV: ${{ secrets.SECRETS_ENV }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          ODDS_API_KEY_SECRET: ${{ secrets.ODDS_API_KEY }}
        run: |
          printf '%s\n' "$SECRETS_ENV" > secrets.env
          if [ -n "$ODDS_API_KEY_SECRET" ]; then
            printf 'ODDS_API_KEY=%s\n' "$ODDS_API_KEY_SECRET" >> secrets.env
          fi
          printf '%s\n' "$SERVICE_ACCOUNT_JSON" > service-account-token.json
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            case "$line" in *=*) ;; *) continue ;; esac
            value="${line#*=}"
            value="${value%\"}"; value="${value#\"}"
            [ -n "$value" ] && echo "::add-mask::$value"
          done < secrets.env

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "footy-tipper-bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Pull runtime state from Drive
        run: python -m pipeline.ops.actions_runner runtime-pull

      - name: Run predict (${{ needs.gate.outputs.mode }})
        env:
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          RUN_MODE: ${{ needs.gate.outputs.mode }}
          CONFIRMED_ROUND: ${{ inputs.confirmed_round }}
        run: |
          printf 'Gate reason: %s\n' "$GATE_REASON"
          if [ -n "$CONFIRMED_ROUND" ]; then
            python -m pipeline.ops.actions_runner predict --mode "$RUN_MODE" --confirmed-round "$CONFIRMED_ROUND"
          else
            python -m pipeline.ops.actions_runner predict --mode "$RUN_MODE"
          fi

      - name: Push runtime state to Drive
        if: success() && needs.gate.outputs.mode != 'test'
        run: python -m pipeline.ops.actions_runner runtime-push

      - name: Publish site
        if: success() && needs.gate.outputs.mode != 'test'
        run: python -m pipeline.ops.actions_runner site-publish

  delivery-alert:
    needs: [gate, predict]
    if: >-
      always() &&
      (github.event_name == 'schedule' || inputs.watchdog == true) &&
      (
        needs.gate.result == 'failure' ||
        needs.predict.result == 'failure' ||
        (needs.gate.outputs.mode == 'live' && needs.predict.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Reconcile automation alert
        uses: actions/github-script@v9
        env:
          ALERT_TITLE: "[footy-tipper] Automated delivery needs attention"
          GATE_MODE: ${{ needs.gate.outputs.mode }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          GATE_RESULT: ${{ needs.gate.result }}
          PREDICT_RESULT: ${{ needs.predict.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.ALERT_TITLE;
            const label = "automation-alert";
            const failed =
              process.env.GATE_RESULT === "failure" ||
              process.env.PREDICT_RESULT === "failure";

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: "b60205",
                description: "Automatic prediction or delivery needs operator attention",
              });
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", labels: label, per_page: 100 },
            );
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (failed) {
              const body = [
                "An automated prediction/delivery run failed.",
                "",
                `- Run: ${runUrl}`,
                `- Event: ${context.eventName}`,
                `- Actor: ${context.actor}`,
                `- Gate result: ${process.env.GATE_RESULT || "unknown"}`,
                `- Gate mode: ${process.env.GATE_MODE || "unknown"}`,
                `- Gate reason: ${process.env.GATE_REASON || "unavailable"}`,
                `- Prediction result: ${process.env.PREDICT_RESULT || "unknown"}`,
                "",
                "Run `footy-tipper status` before attempting any recovery. A pending delivery marker must be reconciled, never resent automatically.",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: [label],
                  assignees: [owner],
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `A successful live run cleared this alert: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
