name: footy-tipper
channels:
  - conda-forge
  - defaults

dependencies:
  # Python runtime + ML dependencies
  - python=3.11
  - numpy<2.0
  - pandas
  - numba
  - scikit-learn
  - xgboost
  - lightgbm
  - matplotlib
  - seaborn
  - scipy
  - beautifulsoup4
  - lxml
  - openpyxl
  - python-dotenv
  - google-api-python-client
  - google-auth
  - gspread
  - joblib
  - dill
  - scikit-optimize

  # R runtime + core R packages used by data-prep scripts
  - r-base
  - r-dplyr
  - r-tidyr
  - r-lubridate
  - r-here
  - r-xml2
  - r-janitor
  - r-zoo
  - r-purrr
  - r-readr
  - r-stringr
  - r-forcats
  - r-tibble
  - r-rsqlite
  - r-dbi
  - r-dotenv

  - gfortran_impl_osx-arm64
  - libgfortran
  - libgfortran5
  - blas

  - pip
  - pip:
      # Install the local CLI entrypoint (`footy-tipper`) during env creation.
      - -e .
      - anthropic>=0.40.0,<1.0.0
      - openai>=1.0.0,<2.0.0
